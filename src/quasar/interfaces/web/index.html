<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quasar AI Runtime 控制台</title>
<style>
  :root{
    --bg:#0f1113; --panel:#171a1d; --panel-2:#1d2126; --line:#2a3037;
    --text:#e7eaed; --muted:#98a2ac; --dim:#6c7681;
    --accent:#5dcaa5; --accent-2:#85b7eb; --warn:#ef9f27; --danger:#f09595;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.6}
  a{color:var(--accent-2)}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.2px}
  .brand svg{display:block}
  .status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--accent)} .dot.bad{background:var(--danger)} .dot.warn{background:var(--warn)}
  main{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:18px 20px 40px;align-items:start}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel h2 svg{flex:0 0 auto}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  textarea,input,button,select{font:inherit;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
  textarea{resize:vertical;min-height:76px}
  textarea:focus,input:focus{border-color:var(--accent)}
  button{cursor:pointer;background:var(--panel-2);border-color:var(--line);width:auto;font-weight:500}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#08221b;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.08);color:#08221b}
  button:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .log{max-height:52vh;overflow:auto;margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .turn{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel-2)}
  .turn.user{border-left:3px solid var(--accent-2)}
  .turn.bot{border-left:3px solid var(--accent)}
  .turn.refused{border-left-color:var(--warn)}
  .turn .who{font-size:12px;color:var(--dim);margin-bottom:6px}
  .turn .body{white-space:pre-wrap;word-break:break-word}
  .meta{margin-top:9px;font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
  .cite{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
  .cite div{padding:3px 0;word-break:break-word}
  .hit{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;background:var(--panel-2)}
  .hit .top{display:flex;gap:10px;font-size:12px;color:var(--dim);margin-bottom:5px}
  .hit .txt{font-size:13px;color:var(--muted);word-break:break-word}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi div{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .kpi b{display:block;font-size:18px;font-weight:600;color:var(--accent)}
  .kpi span{font-size:12px;color:var(--dim)}
  pre.json{background:#0b0d0f;border:1px solid var(--line);border-radius:9px;padding:11px;
    overflow:auto;max-height:340px;font-size:12px;color:var(--muted);margin:10px 0 0}
  .muted{color:var(--dim);font-size:12px}
  .err{color:var(--danger)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5dcaa5" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="2.6"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-30 12 12)"/>
    </svg>
    Quasar AI Runtime
  </div>
  <span class="muted" id="modeLabel">运行时状态读取中</span>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中</span></div>
</header>

<main>
  <section class="panel">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#85b7eb" stroke-width="1.6" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      问答（带证据绑定）
    </h2>
    <textarea id="question" placeholder="输入问题，答案必须带 [n] 引用，无依据时系统会拒答。"></textarea>
    <div class="toolbar">
      <button class="primary" id="askBtn">发送（流式）</button>
      <button id="askSyncBtn">发送（完整结构）</button>
      <button id="clearMemBtn">清空会话记忆</button>
      <span class="muted" id="askHint"></span>
    </div>
    <div class="log" id="log"></div>
  </section>

  <div style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <h2>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5dcaa5" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        混合检索
      </h2>
      <div class="row"><input id="query" placeholder="查询语句" /></div>
      <div class="toolbar"><button id="searchBtn">检索</button><span class="muted" id="searchHint"></span></div>
      <div id="hits" style="margin-top:12px"></div>
    </section>

    <section class="panel">
      <h2>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#85b7eb" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
        采集与状态
      </h2>
      <textarea id="ingestText" placeholder="粘贴要写入知识库的文本"></textarea>
      <div class="toolbar">
        <button id="ingestBtn">写入文本</button>
        <button id="corpusBtn">采集 assets/corpus</button>
        <button id="statsBtn">刷新状态</button>
      </div>
      <div class="kpi" style="margin-top:12px">
        <div><b id="kDoc">-</b><span>文档数</span></div>
        <div><b id="kChunk">-</b><span>知识块</span></div>
      </div>
      <pre class="json" id="jsonOut">就绪。</pre>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const dot = $('dot'), statusText = $('statusText');

function setStatus(kind, text){
  dot.className = 'dot' + (kind ? ' ' + kind : '');
  statusText.textContent = text;
}
function show(obj){
  $('jsonOut').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
}
function esc(s){ return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function jsonFetch(url, options){
  const res = await fetch(url, options);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = { raw: text }; }
  if(!res.ok){
    throw new Error((data && (data.message || data.detail)) || ('HTTP ' + res.status));
  }
  return data;
}

async function refreshHealth(){
  try{
    const h = await jsonFetch('/health');
    setStatus(h.ok ? 'ok' : 'warn', h.ok ? '组件全部健康' : '部分组件降级');
    $('modeLabel').textContent = '模式 ' + h.mode + ' · ' + h.detail;
    return h;
  }catch(e){
    setStatus('bad', '无法连接服务');
    $('modeLabel').textContent = String(e.message || e);
    return null;
  }
}

async function refreshStats(){
  try{
    const s = await jsonFetch('/v1/stats');
    $('kDoc').textContent = s.documents;
    $('kChunk').textContent = s.chunks;
    show(s);
  }catch(e){ show({ error: String(e.message || e) }); }
}

function turn(role, label){
  const el = document.createElement('div');
  el.className = 'turn ' + role;
  el.innerHTML = '<div class="who">' + esc(label) + '</div><div class="body"></div><div class="meta"></div><div class="cite"></div>';
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return el;
}

function renderCitations(el, citations, evidence){
  const box = el.querySelector('.cite');
  if(!citations || !citations.length){ box.textContent = ''; return; }
  const byId = {};
  (evidence || []).forEach((e, i) => { byId[i + 1] = e.chunk; });
  box.innerHTML = citations.map(c => {
    const chunk = byId[c.index];
    const snippet = chunk ? chunk.text.slice(0, 110).replace(/\\s+/g, ' ') : '';
    return '<div><b>' + esc(c.marker) + '</b> ' + esc(c.chunk_id) + (snippet ? ' — ' + esc(snippet) : '') + '</div>';
  }).join('');
}

async function askStream(){
  const q = $('question').value.trim();
  if(!q){ $('askHint').textContent = '请输入问题'; return; }
  $('askBtn').disabled = true; $('askSyncBtn').disabled = true; $('askHint').textContent = '';
  turn('user', '你').querySelector('.body').textContent = q;
  const bot = turn('bot', 'Quasar');
  const body = bot.querySelector('.body');
  try{
    const res = await fetch('/v1/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, session_id:'web' })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(); const decoder = new TextDecoder();
    let buffer = '';
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream:true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for(const part of parts){
        if(!part.startsWith('data:')) continue;
        const payload = part.slice(5).trim();
        if(!payload || payload === '{}') continue;
        const evt = JSON.parse(payload);
        if(evt.type === 'delta'){ body.textContent += evt.text; }
        else if(evt.type === 'final'){
          if(evt.refused){ bot.classList.add('refused'); }
          bot.querySelector('.meta').innerHTML =
            '证据 ' + (evt.evidence || []).length + ' 条 · 引用 ' + (evt.citations || []).length + ' 处' +
            (evt.degraded ? ' · <span class="err">' + esc(evt.degraded) + '</span>' : '');
          renderCitations(bot, evt.citations, evt.evidence);
        }
      }
      $('log').scrollTop = $('log').scrollHeight;
    }
  }catch(e){
    bot.classList.add('refused');
    body.textContent = '请求失败：' + String(e.message || e);
  }finally{
    $('askBtn').disabled = false; $('askSyncBtn').disabled = false;
  }
}

async function askSync(){
  const q = $('question').value.trim();
  if(!q){ $('askHint').textContent = '请输入问题'; return; }
  $('askBtn').disabled = true; $('askSyncBtn').disabled = true;
  turn('user', '你').querySelector('.body').textContent = q;
  const bot = turn('bot', 'Quasar');
  try{
    const r = await jsonFetch('/v1/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, session_id:'web' })
    });
    if(r.refused) bot.classList.add('refused');
    bot.querySelector('.body').textContent = r.answer;
    bot.querySelector('.meta').innerHTML =
      '模型 ' + esc(r.model) + ' · 步数 ' + r.steps + ' · 工具 ' + r.tool_calls +
      ' · 证据 ' + (r.evidence || []).length + ' · ' + Math.round(r.latency_ms) + 'ms · trace ' + esc(r.trace_id);
    renderCitations(bot, r.citations, r.evidence);
    show(r);
  }catch(e){
    bot.classList.add('refused');
    bot.querySelector('.body').textContent = '请求失败：' + String(e.message || e);
  }finally{
    $('askBtn').disabled = false; $('askSyncBtn').disabled = false;
  }
}

async function runSearch(){
  const q = $('query').value.trim();
  if(!q) return;
  $('searchHint').textContent = '检索中…';
  try{
    const r = await jsonFetch('/v1/search', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query:q })
    });
    $('searchHint').textContent = '词法 ' + r.lexical_hits + ' · 稠密 ' + r.dense_hits +
      ' · 融合 ' + r.fused_hits + ' · ' + r.latency_ms.toFixed(1) + 'ms' +
      (r.degraded ? ' · 降级：' + r.degraded : '');
    $('hits').innerHTML = r.hits.map(h =>
      '<div class="hit"><div class="top"><span>#' + h.rank + '</span><span>分数 ' + h.score.toFixed(4) +
      '</span><span>' + esc(h.stage) + '</span><span>' + esc(h.chunk_id) + '</span></div>' +
      '<div class="txt">' + esc(h.text.slice(0, 260)) + '</div></div>'
    ).join('') || '<div class="muted">无结果</div>';
  }catch(e){ $('searchHint').innerHTML = '<span class="err">' + esc(String(e.message || e)) + '</span>'; }
}

async function doIngest(){
  const t = $('ingestText').value.trim();
  if(!t){ show({ error: '请输入要写入的文本' }); return; }
  try{
    const r = await jsonFetch('/v1/ingest', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text:t, source:'web-console', metadata:{ origin:'console' } })
    });
    show(r); await refreshStats();
  }catch(e){ show({ error: String(e.message || e) }); }
}

async function doCorpus(){
  try{ show(await jsonFetch('/v1/ingest/corpus', { method:'POST' })); await refreshStats(); }
  catch(e){ show({ error: String(e.message || e) }); }
}

async function clearMemory(){
  try{ show(await jsonFetch('/v1/memory/clear', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ session_id:'web' })
  })); }catch(e){ show({ error: String(e.message || e) }); }
}

$('askBtn').onclick = askStream;
$('askSyncBtn').onclick = askSync;
$('searchBtn').onclick = runSearch;
$('ingestBtn').onclick = doIngest;
$('corpusBtn').onclick = doCorpus;
$('statsBtn').onclick = refreshStats;
$('clearMemBtn').onclick = clearMemory;
$('query').addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });

(async function init(){
  await refreshHealth();
  await refreshStats();
  setInterval(refreshHealth, 20000);
})();
</script>
</body>
</html>
