[project]
name = "quasar-ai-runtime"
version = "0.1.0"
description = "Quasar - modular, single-responsibility, end-to-end runnable AI runtime: hybrid retrieval + tool-using agent + evidence-bound answers. Offline-verifiable, one-command reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
maintainers = [{ name = "晨星" }]
keywords = ["ai", "rag", "agent", "hybrid-retrieval", "llm", "ollama", "reproducible"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "numpy==2.5.3",
    "rank-bm25==0.2.2",
    "orjson==3.12.0",
    "typer==0.27.2",
    "rich==15.0.0",
    "pypdf==6.19.0",
    "qdrant-client==1.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
quasar = "quasar.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/CJX0712/quasar-ai-runtime"
Repository = "https://github.com/CJX0712/quasar-ai-runtime"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quasar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
